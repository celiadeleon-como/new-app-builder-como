<div class="app-page px-member-experience" data-page="account">
  <header class="px-phone-page-head">
    <button class="px-phone-back" type="button" onclick="showPhonePage('home')" aria-label="Back to Home">‹</button>
    <div><strong>My Account</strong><span>Membership and preferences</span></div>
    <button class="icon-btn px-profile-icon" type="button" aria-label="Profile options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0114 0"/></svg></button>
  </header>
  <div class="px-member-scroll px-account-scroll">
    <section class="px-profile-summary">
      <span class="px-profile-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0114 0"/></svg></span>
      <strong>Customer name</strong>
      <span class="px-profile-loyalty">Loyalty number • 1234 5678 9012</span>
      <span class="px-profile-points">Points <b>1,250 pts</b></span>
    </section>
    <section class="px-profile-list" aria-label="Account settings">
      <button type="button"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0114 0"/></svg></span><div><strong>Account settings</strong><small>Contact info</small></div><i>›</i></button>
      <button type="button" onclick="showPhonePage('gifts')"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M12 8v13M3 12h18"/><path d="M12 8H8.5a2.5 2.5 0 010-5C11 3 12 8 12 8zM12 8h3.5a2.5 2.5 0 000-5C13 3 12 8 12 8z"/></svg></span><div><strong>Gift cards</strong><small>Add and view gift cards</small></div><i>›</i></button>
    </section>
    <button class="px-sign-out" type="button" onclick="showPhonePage('login')">Sign out</button>
  </div>
</div>
